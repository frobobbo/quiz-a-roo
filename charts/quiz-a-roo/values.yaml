# Global naming overrides
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/frobobbo/quiz-a-roo
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

container:
  port: 3000

env:
  NODE_ENV: production
  DATA_DIR: /data

# Optional Kubernetes Secret references for AI/TTS provider keys.
# Example:
# extraEnvFrom:
#   - secretRef:
#       name: quiz-a-roo-provider-keys
extraEnvFrom: []

persistence:
  enabled: true
  size: 2Gi
  accessMode: ReadWriteOnce
  storageClass: ""
  mountPath: /data

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: quiz-a-roo.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 20
  periodSeconds: 30
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3

nodeSelector: {}
tolerations: []
affinity: {}
