name: Branch Harvester PostgreSQL Deploy

on:
  push:
    branches-ignore:
      - 'main'
  pull_request:
    branches-ignore:
      - 'main'
  workflow_dispatch:
    inputs:
      release_name:
        description: Helm release name for the branch deployment
        required: false
        default: quiz-a-roo-postgres
      namespace:
        description: Kubernetes namespace for the branch deployment
        required: false
        default: quiz-a-roo-postgres
      ingress_host:
        description: Optional ingress host to enable for this branch deployment
        required: false
        default: ""

concurrency:
  group: quiz-a-roo-postgres-branch-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
  CHART_PATH: ./charts/quiz-a-roo
  DEFAULT_RELEASE_NAME: quiz-a-roo-postgres
  DEFAULT_NAMESPACE: quiz-a-roo-postgres

jobs:
  validate:
    name: Validate app and Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check Node sources
        run: |
          set -euo pipefail
          node --check server.js
          node --check db/index.js
          node --check db/migrate.js
          for file in db/repositories/*.js; do
            node --check "$file"
          done

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Lint Helm chart
        run: helm lint "$CHART_PATH"

      - name: Render Helm chart with PostgreSQL enabled
        env:
          POSTGRES_PASSWORD: ${{ secrets.QUIZ_A_ROO_BRANCH_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "Missing required repository secret: QUIZ_A_ROO_BRANCH_POSTGRES_PASSWORD" >&2
            exit 1
          fi
          if ! printf '%s' "$POSTGRES_PASSWORD" | grep -Eq '^[A-Za-z0-9_.~-]+$'; then
            echo "QUIZ_A_ROO_BRANCH_POSTGRES_PASSWORD must be URL-safe: A-Z a-z 0-9 _ . ~ -" >&2
            exit 1
          fi
          echo "::add-mask::$POSTGRES_PASSWORD"
          helm template "$DEFAULT_RELEASE_NAME" "$CHART_PATH" \
            --namespace "$DEFAULT_NAMESPACE" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="sha-${GITHUB_SHA::7}" \
            --set database.enabled=true \
            --set postgresql.enabled=true \
            --set postgresql.auth.password="$POSTGRES_PASSWORD" \
            >/tmp/quiz-a-roo-rendered.yaml
          grep -q 'name: db-migrate' /tmp/quiz-a-roo-rendered.yaml
          grep -q 'kind: StatefulSet' /tmp/quiz-a-roo-rendered.yaml
          grep -q 'DATABASE_URL' /tmp/quiz-a-roo-rendered.yaml

  build-image:
    name: Build and push branch image
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.image-tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: image-tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=postgres-branch

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-harvester:
    name: Deploy branch to Harvester
    runs-on: harvester
    needs: [build-image]
    if: github.ref == 'refs/heads/feature/postgres-backend' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_NAME: ${{ github.event.inputs.release_name || 'quiz-a-roo-postgres' }}
      NAMESPACE: ${{ github.event.inputs.namespace || 'quiz-a-roo-postgres' }}
      INGRESS_HOST: ${{ github.event.inputs.ingress_host || '' }}
      IMAGE_TAG: ${{ needs.build-image.outputs.image_tag }}
      POSTGRES_PASSWORD: ${{ secrets.QUIZ_A_ROO_BRANCH_POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl and Helm if needed
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          if ! command -v kubectl >/dev/null 2>&1; then
            curl -fsSL -o "$RUNNER_TEMP/bin/kubectl" \
              "https://dl.k8s.io/release/v1.30.6/bin/linux/amd64/kubectl"
            chmod +x "$RUNNER_TEMP/bin/kubectl"
          fi

          if ! command -v helm >/dev/null 2>&1; then
            curl -fsSL -o "$RUNNER_TEMP/helm.tgz" \
              "https://get.helm.sh/helm-v3.15.4-linux-amd64.tar.gz"
            tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP"
            mv "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/bin/helm"
            chmod +x "$RUNNER_TEMP/bin/helm"
          fi

      - name: Validate required secret
        run: |
          set -euo pipefail
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "Missing required repository secret: QUIZ_A_ROO_BRANCH_POSTGRES_PASSWORD" >&2
            exit 1
          fi
          if ! printf '%s' "$POSTGRES_PASSWORD" | grep -Eq '^[A-Za-z0-9_.~-]+$'; then
            echo "QUIZ_A_ROO_BRANCH_POSTGRES_PASSWORD must be URL-safe: A-Z a-z 0-9 _ . ~ -" >&2
            exit 1
          fi
          echo "::add-mask::$POSTGRES_PASSWORD"

      - name: Ensure GHCR image pull secret
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GHCR_TOKEN"
          echo "Using existing namespace: $NAMESPACE"
          kubectl create secret docker-registry ghcr-secret \
            --namespace "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Verify namespace-scoped deploy permissions
        run: |
          set -euo pipefail
          kubectl auth can-i get deployments -n "$NAMESPACE"
          kubectl auth can-i create deployments -n "$NAMESPACE"
          kubectl auth can-i patch deployments -n "$NAMESPACE"
          kubectl auth can-i get statefulsets -n "$NAMESPACE"
          kubectl auth can-i create statefulsets -n "$NAMESPACE"
          kubectl auth can-i patch statefulsets -n "$NAMESPACE"
          kubectl auth can-i get secrets -n "$NAMESPACE"
          kubectl auth can-i create secrets -n "$NAMESPACE"
          kubectl auth can-i patch secrets -n "$NAMESPACE"

      - name: Deploy PostgreSQL-backed branch release
        run: |
          set -euo pipefail
          HELM_ARGS=(
            upgrade --install "$RELEASE_NAME" "$CHART_PATH"
            --namespace "$NAMESPACE"
            --set image.repository="$IMAGE_REPOSITORY"
            --set image.tag="$IMAGE_TAG"
            --set database.enabled=true
            --set postgresql.enabled=true
            --set postgresql.auth.password="$POSTGRES_PASSWORD"
          )

          if [ -n "$INGRESS_HOST" ]; then
            HELM_ARGS+=(
              --set ingress.enabled=true
              --set-string ingress.hosts[0].host="$INGRESS_HOST"
              --set-string ingress.hosts[0].paths[0].path=/
              --set-string ingress.hosts[0].paths[0].pathType=Prefix
            )
          fi

          helm "${HELM_ARGS[@]}" --wait --timeout 10m

      - name: Verify rollout and database pod
        run: |
          set -euo pipefail
          if [[ "$RELEASE_NAME" == *"quiz-a-roo"* ]]; then
            APP_NAME="$RELEASE_NAME"
          else
            APP_NAME="${RELEASE_NAME}-quiz-a-roo"
          fi
          kubectl rollout status deployment/${APP_NAME} -n "$NAMESPACE" --timeout=5m
          kubectl rollout status statefulset/${APP_NAME}-postgres -n "$NAMESPACE" --timeout=5m
          kubectl get svc,pods,pvc -n "$NAMESPACE" -l app.kubernetes.io/instance="$RELEASE_NAME" -o wide

      - name: In-cluster health smoke test
        run: |
          set -euo pipefail
          if [[ "$RELEASE_NAME" == *"quiz-a-roo"* ]]; then
            APP_NAME="$RELEASE_NAME"
          else
            APP_NAME="${RELEASE_NAME}-quiz-a-roo"
          fi
          SMOKE_POD="${RELEASE_NAME}-smoke-${GITHUB_RUN_ID}"
          kubectl run "$SMOKE_POD" \
            --namespace "$NAMESPACE" \
            --image=curlimages/curl:8.10.1 \
            --restart=Never \
            --rm -i \
            --command -- curl -fsS "http://${APP_NAME}:80/healthz"
