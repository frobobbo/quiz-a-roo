name: Build, Push, and Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-image:
    name: Build Quiz-a-Roo Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-harvester:
    name: Deploy to Harvester
    runs-on: harvester
    needs: [build-image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_NAME: quiz-a-roo
      NAMESPACE: quiz-a-roo
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl and Helm if needed
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          if ! command -v kubectl >/dev/null 2>&1; then
            curl -fsSL -o "$RUNNER_TEMP/bin/kubectl" \
              "https://dl.k8s.io/release/v1.30.6/bin/linux/amd64/kubectl"
            chmod +x "$RUNNER_TEMP/bin/kubectl"
          fi

          if ! command -v helm >/dev/null 2>&1; then
            curl -fsSL -o "$RUNNER_TEMP/helm.tgz" \
              "https://get.helm.sh/helm-v3.15.4-linux-amd64.tar.gz"
            tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP"
            mv "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/bin/helm"
            chmod +x "$RUNNER_TEMP/bin/helm"
          fi

      - name: Verify in-cluster deploy permissions
        run: |
          set -euo pipefail
          # Avoid cluster-wide API discovery here; keep the runner least-privileged
          # by checking only the app namespace.
          kubectl auth can-i get deployments -n "$NAMESPACE"
          kubectl auth can-i patch deployments -n "$NAMESPACE"
          kubectl auth can-i get secrets -n "$NAMESPACE"
          kubectl auth can-i create secrets -n "$NAMESPACE"
          kubectl auth can-i patch secrets -n "$NAMESPACE"

      - name: Ensure GHCR image pull secret
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          if [ -z "$GHCR_TOKEN" ]; then
            echo "github.token is empty; cannot create GHCR pull secret" >&2
            exit 1
          fi
          echo "::add-mask::$GHCR_TOKEN"

          kubectl create secret docker-registry ghcr-secret \
            --namespace "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy updated image to Harvester
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="sha-${SHORT_SHA}"

          if helm status "$RELEASE_NAME" -n "$NAMESPACE" >/dev/null 2>&1; then
            REUSE_ARGS=(--reuse-values)
          else
            REUSE_ARGS=()
          fi

          helm upgrade --install "$RELEASE_NAME" ./charts/quiz-a-roo \
            --namespace "$NAMESPACE" \
            --create-namespace \
            "${REUSE_ARGS[@]}" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="$IMAGE_TAG" \
            --wait --timeout 10m

      - name: Verify rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/${RELEASE_NAME} -n "$NAMESPACE" --timeout=5m
          kubectl get svc,pods,pvc -n "$NAMESPACE" -l app.kubernetes.io/instance="$RELEASE_NAME" -o wide
