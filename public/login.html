<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trivia Night — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%; background: #080820; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #0a0a3a; border: 2px solid #c09a38; border-radius: 16px;
      padding: 36px; width: min(420px, 92vw); text-align: center;
      box-shadow: 0 12px 48px rgba(0,0,0,.7);
    }
    h1 { font-family: Impact, sans-serif; font-size: 24px; letter-spacing: 3px; color: #c09a38; margin-bottom: 8px; }
    .sub { font-size: 13px; color: rgba(255,255,255,.55); margin-bottom: 24px; line-height: 1.4; }
    label { display: block; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,.55); margin: 14px 0 6px; }
    input {
      width: 100%; padding: 13px; font-size: 17px; background: #16166a;
      border: 2px solid #2a2a5a; border-radius: 10px; color: #fff; outline: none;
    }
    input:focus { border-color: #c09a38; }
    .error { color: #ff6b6b; font-size: 13px; margin-top: 12px; min-height: 20px; }
    button {
      margin-top: 20px; width: 100%; padding: 14px; font-size: 15px; font-weight: 700;
      font-family: inherit; background: #c09a38; color: #000; border: none;
      border-radius: 10px; cursor: pointer; letter-spacing: 1px; transition: filter .15s;
    }
    button:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
<div class="card">
  <h1>TRIVIA LOGIN</h1>
  <div class="sub">Sign in to your own host board. A new username creates a new board, library, history, and settings profile.</div>
  <form method="POST" action="login" autocomplete="on">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" minlength="3" maxlength="50" pattern="[A-Za-z0-9_.\-]+" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" minlength="1" autocomplete="current-password" required>
    <div class="error" id="err"></div>
    <button type="submit">CONTINUE →</button>
  </form>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const err = document.getElementById('err');
  if (params.get('error') === 'missing') err.textContent = 'Enter a username and password.';
  if (params.get('error') === 'invalid') err.textContent = 'That username exists, but the password was incorrect.';
</script>
</body>
</html>
