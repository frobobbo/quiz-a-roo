<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>quiz-a-roo — Host Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%; background: #02040f; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #06123f; border: 2px solid #ffb21a; border-radius: 16px;
      padding: 40px 36px 32px; width: min(380px, 92vw); text-align: center;
      box-shadow: 0 12px 48px rgba(0,0,0,.7);
    }
    h1 { font-family: Impact, sans-serif; font-size: 22px; letter-spacing: 4px; color: #ffb21a; margin-bottom: 6px; }
    .sub { font-size: 13px; color: rgba(255,255,255,.4); margin-bottom: 28px; }
    label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,.4); margin-bottom: 8px; }
    input[type="text"] {
      width: 100%; padding: 14px; font-size: 28px; font-family: Impact, sans-serif;
      letter-spacing: 8px; text-align: center; background: #082a8f;
      border: 2px solid #2a2a5a; border-radius: 10px; color: #fff; outline: none;
    }
    input[type="text"]:focus { border-color: #ffb21a; }
    .error { color: #ff6b6b; font-size: 13px; margin-top: 10px; min-height: 20px; }
    button {
      margin-top: 20px; width: 100%; padding: 14px; font-size: 15px; font-weight: 700;
      font-family: inherit; background: #ffb21a; color: #000; border: none;
      border-radius: 10px; cursor: pointer; letter-spacing: 1px; transition: filter .15s;
    }
    button:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
<div class="card">
  <h1>HOST ACCESS</h1>
  <div class="sub">Enter the PIN shown in your server console</div>
  <form method="POST" action="host-auth">
    <label for="pin">Host PIN</label>
    <input type="text" id="pin" name="pin" maxlength="4" placeholder="••••"
           autocomplete="off" inputmode="numeric" autofocus>
    <div class="error" id="err"></div>
    <button type="submit">ENTER →</button>
  </form>
</div>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get('error')) document.getElementById('err').textContent = 'Incorrect PIN — try again.';
  document.getElementById('pin').addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '').slice(0, 4);
  });
</script>
</body>
</html>
